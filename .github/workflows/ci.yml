name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: helm lint charts/kubeflock --values charts/kubeflock/values.example.yaml
      - run: helm template kubeflock charts/kubeflock --namespace developer --values charts/kubeflock/values.example.yaml > /dev/null
