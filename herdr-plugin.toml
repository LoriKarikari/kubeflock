id = "kubeflock"
name = "Kubeflock"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Herdr agent environments on Kubernetes (explicit context check first)"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/kubeflock", "./cmd/kubeflock"]
platforms = ["linux", "macos"]

[[actions]]
id = "cluster-check"
title = "Kubeflock: Check cluster target"
description = "Check whether the configured Kubernetes context and namespace meet Kubeflock prerequisites."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "cluster", "check", "--output", "text"]

[[actions]]
id = "cluster-config-show"
title = "Kubeflock: Show cluster target"
description = "Show the Kubernetes context and namespace configured for Kubeflock."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "cluster", "config", "show"]

[[actions]]
id = "sandbox-create"
title = "Kubeflock: Create sandbox"
description = "Choose an approved template and create a persistent Kubernetes sandbox."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "create-action"]

[[actions]]
id = "sandbox-list"
title = "Kubeflock: List sandboxes"
description = "List observed Kubeflock sandbox lifecycle states."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "list"]

[[actions]]
id = "sandbox-reconnect"
title = "Kubeflock: Reconnect sandbox"
description = "Reconnect the saved sandbox without changing the current Herdr selection."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "reconnect"]

[[actions]]
id = "sandbox-stop"
title = "Kubeflock: Stop sandbox"
description = "Stop sandbox compute while retaining its persistent home."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "stop"]

[[actions]]
id = "sandbox-resume"
title = "Kubeflock: Resume sandbox"
description = "Resume a stopped sandbox and restore its saved connection."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "resume"]

[[actions]]
id = "sandbox-delete"
title = "Kubeflock: Delete sandbox and retain home"
description = "Stop and remove a sandbox while preserving its persistent home."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "delete"]

[[actions]]
id = "home-list"
title = "Kubeflock: List retained homes"
description = "List persistent homes retained from deleted sandboxes."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "home", "list"]

[[actions]]
id = "sandbox-disconnect"
title = "Kubeflock: Disconnect sandbox"
description = "Disconnect the saved sandbox while leaving its remote processes running."
contexts = ["workspace", "pane"]
command = ["bin/kubeflock", "sandbox", "disconnect"]

[[panes]]
id = "create"
title = "Create Kubeflock sandbox"
placement = "popup"
width = "80%"
height = 12
command = ["bin/kubeflock", "sandbox", "create-wizard"]
