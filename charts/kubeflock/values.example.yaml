namespace:
  name: developer-sandboxes

access:
  subjects:
    - kind: User
      name: developer@example.com

credentials:
  - name: anthropic
    secretName: anthropic-api-key
    key: api-key
    environment: ANTHROPIC_API_KEY

sandbox:
  # Required. Kubeflock does not currently publish a Sandbox image.
  image: registry.example.com/replace-with-your-sandbox-image@sha256:replace-me
  sshPublicKey: ssh-ed25519 replace-me
  storage:
    className: standard

capacity:
  maxActiveSandboxes: 2
  maxRetainedHomes: 4
